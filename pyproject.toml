[project]
name = "kb-rag-backend"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.10.3",
  "pydantic-settings==2.6.1",
  "sqlmodel==0.0.22",
  "psycopg2-binary",
  "pg8000==1.31.2",
  "asyncpg==0.30.0",
  "python-multipart==0.0.12",
  "python-jose==3.3.0",
  "fastembed==0.3.1",
  "huggingface-hub==0.34.0",
  "qdrant-client==1.11.3",
  "pypdf==5.1.0",
  "python-docx==1.1.2",
  "httpx==0.28.1",
  "groq>=0.5.0",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
